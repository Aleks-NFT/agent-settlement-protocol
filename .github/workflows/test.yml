name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-anchor-0.32.1-v2

      - name: Install system deps (libudev for hidapi)
        run: sudo apt-get install -y libudev-dev pkg-config

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI 0.32.1
        run: |
          if ! command -v anchor &>/dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked
          fi
          anchor --version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules/
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}-v2

      - name: Install dependencies
        run: yarn install

      - name: Copy IDL
        run: |
          mkdir -p target/idl target/types target/deploy
          cp packages/mcp-server/idl/agentvault.json target/idl/agentvault.json

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Build litesvm native binding from source
        run: |
          git clone --depth 1 --branch node-v0.3.3 https://github.com/LiteSVM/litesvm /tmp/litesvm-src
          ls /tmp/litesvm-src/
          find /tmp/litesvm-src -name "package.json" -maxdepth 3 | grep -v node_modules
          PKGDIR=$(dirname $(find /tmp/litesvm-src -name "package.json" -maxdepth 3 | grep -v node_modules | head -1))
          echo "Building in: $PKGDIR"
          cd $PKGDIR
          yarn install
          yarn build
          NODEFILE=$(find $PKGDIR -name "*.linux-x64-gnu.node" | head -1)
          echo "Built: $NODEFILE"
          cp $NODEFILE $GITHUB_WORKSPACE/node_modules/litesvm-linux-x64-gnu/litesvm.linux-x64-gnu.node
          echo "✓ done"
      - name: Run tests (isolated processes)
        run: |
          set -e
          free -h
          for grep in \
            "PDA|fee|PolicyController|escrow" \
            "init_reputation" \
            "lock: SettlementNft|lock → revert|revert twice" \
            "execute_trade|pre_check → execute_trade|InvalidFill" \
            "settle|post_check|PriceStale" \
            "list_for_sale|buy_settlement" \
            "credit_bond"; do
            echo "::group::Tests: $grep"
            NODE_OPTIONS="--max-old-space-size=4096" \
              yarn ts-mocha -p ./tsconfig.json -t 1000000 \
              tests/agentvault-litesvm.ts --grep "$grep"
            echo "::endgroup::"
          done
          free -h
