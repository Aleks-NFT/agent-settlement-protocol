cat > /workspaces/agent-settlement-protocol/.github/workflows/test.yml << 'EOF'
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-anchor-0.32.1
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Solana CLI (no SBF tools)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI 0.32.1
        run: |
          if ! command -v anchor &>/dev/null; then
            cargo install --git https://github.com/coral-xyz/anchor \
              --tag v0.32.1 anchor-cli --locked
          fi
          anchor --version

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules/
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Copy committed IDL (skip SBF build)
        run: |
          mkdir -p target/idl target/types target/deploy
          cp packages/mcp-server/idl/agentvault.json target/idl/agentvault.json
          echo '{"programId":"5SV1Q7yEff4jh5NkH48pTh5okh9mKAXXqdUMjfimWHVW"}' \
            > target/deploy/agentvault-keypair.json
          echo "✓ IDL copied from committed version"

      - name: Run tests (LiteSVM — skip build + deploy)
        run: anchor test --skip-build --skip-deploy
EOF
echo "✓ workflow updated"
