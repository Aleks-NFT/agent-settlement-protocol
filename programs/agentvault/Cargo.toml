[package]
name = "agentvault"
version = "0.1.0"
description = "Agent Settlement Protocol — Clearing House for AI Agents on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agentvault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
